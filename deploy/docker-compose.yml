# 各环境配置位于 deploy/env/<环境>.env，推荐通过交互脚本使用：
#   pnpm docker:build    选择环境 → 构建镜像 → 询问是否启动
# 手动等价命令：
#   docker compose -f deploy/docker-compose.yml --env-file deploy/env/dev.env up -d --build
name: ${COMPOSE_PROJECT_NAME:-wmdg}

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # 构建时使用的 npm 源，默认走国内镜像；可在 env 文件中覆盖
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: ${IMAGE_NAME:-world-model-data-generator-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8081}:80'
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8081}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
